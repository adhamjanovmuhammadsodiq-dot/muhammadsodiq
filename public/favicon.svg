<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="#0F172A" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0F172A" stroke="url(#brandGrad)" stroke-width="2" stroke-opacity="0.6" />
  
  <!-- Circuit node accents -->
  <circle cx="16" cy="16" r="2.5" fill="#06B6D4" />
  <line x1="16" y1="16" x2="22" y2="16" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <circle cx="48" cy="48" r="2" fill="#2563EB" />

  <!-- Monogram MS -->
  <text x="32" y="42" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="26" font-weight="900" fill="url(#brandGrad)" text-anchor="middle" letter-spacing="-1">MS</text>
  
  <!-- Tech dot -->
  <circle cx="46" cy="22" r="3" fill="#10B981" />
</svg>
